name: Focused improvement
description: Propose a bounded change to installation, Android integration, compatibility, or contributor tooling.
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe what you are trying to do and the current obstacle.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and boundaries
      description: Prefer existing upstream Omarchy/Hyprland behavior where it fits. Identify any Android-specific behavior and what would demonstrate completion.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: References or a small experiment
      description: Link relevant upstream documentation, a reproducible test, or an implementation reference if available.

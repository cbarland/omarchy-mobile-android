name: Mobile upstream compatibility

on:
  workflow_dispatch:
    inputs:
      mobile_ref:
        description: Mobile branch or full commit to probe without promoting it
        type: string
        required: true
        default: main

permissions:
  contents: read

jobs:
  source-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Resolve once, package and verify candidate source
        env:
          MOBILE_REF: ${{ inputs.mobile_ref }}
        run: python3 tools/check-upstream.py --mobile-ref "$MOBILE_REF" --output app/build/upstream-check
      - name: Save candidate pins, source payload and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mobile-upstream-source-evidence
          path: |
            app/build/upstream-check/report.json
            app/build/upstream-check/candidate.lock.json
            app/build/upstream-check/*.stdout
            app/build/upstream-check/*.stderr
            app/build/upstream-check/candidate/
            app/build/upstream-check/canonical/report.json
          if-no-files-found: warn
          retention-days: 7

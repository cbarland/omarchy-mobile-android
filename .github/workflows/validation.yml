name: Contribution validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-10-15
        with:
          persist-credentials: false
      - name: Python host regressions
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
      - name: Native socket credential regression
        run: |
          cc -D_GNU_SOURCE -O1 -g -ffunction-sections -fdata-sections \
            -Ivendor/tawcroot/include tools/tests/test_socket_credentials.c \
            -Wl,--gc-sections -o "$RUNNER_TEMP/test_socket_credentials"
          "$RUNNER_TEMP/test_socket_credentials"

  core-android:
    name: Clean core APK, JVM tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-dependency-path: |
            **/*.gradle.kts
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Install the exact Android toolchain
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          sdk = Path(os.environ['ANDROID_HOME'])
          manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
          # Include preview channels: the project pins NDK r30-beta1.
          # Fail if the exact package disappears; do not substitute versions.
          subprocess.run([str(manager), '--install', '--channel=3',
                          'platforms;android-37.0', 'build-tools;36.0.0',
                          'cmake;4.1.2', 'ndk;30.0.14904198'],
                         input='y\n' * 100, text=True, check=True, timeout=900)
          PY
      - name: Confirm that this is the core build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for directory in ('app/src/main/prebuilt', 'app/src/main/jniLibs'):
              assert not list(Path(directory).rglob('*.so')), 'Graphics staging must be tested separately'
          PY
      - name: Build core APK and run JVM checks
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Save core validation APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-validation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core-validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
